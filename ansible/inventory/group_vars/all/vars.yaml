---
# Non-secret variables shared across all hosts.
# Secrets live in vault.yaml alongside this file (ansible-vault encrypted)
# and are referenced here or in roles via their `vault_`-prefixed names.

# User
pi_user: pi
pi_home: /home/pi
pi_locale: en_US.UTF-8

# Paths
data_path: /mnt/data
repo_path: "{{ pi_home }}/rpi-media-server"
repo_url: git@github.com:dpinhas/rpi-media-server.git
repo_branch: main

# Network
duckdns_domain: dpinhas.duckdns.org
local_subnet: 192.168.68.0/24

# Git identity
git_user_name: Dor Pinhas
git_user_email: dor.pinhas1@gmail.com

# System packages shared across all hosts
common_packages:
  - vim
  - git
  - libffi-dev
  - libssl-dev
  - python3-dev
  - python3
  - python3-pip
  - nfs-common
  - needrestart

# SSH identity the Pis use for git-over-SSH to GitHub. This key is already
# present on both hosts (same key as the control node's
# ~/.ssh/personal/id_ed25519). Overridable per host if they ever diverge.
#
# Must be a path that EXISTS: naming an IdentityFile replaces OpenSSH's default
# candidate list rather than adding to it, so a wrong path means no usable key
# is offered at all.
ssh_git_identity: "{{ pi_home }}/.ssh/id_ed25519"
