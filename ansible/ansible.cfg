[defaults]
inventory = inventory/hosts.yaml
roles_path = roles
remote_user = pi
interpreter_python = /usr/bin/python3

# Host-key checking is ENABLED. The control node authenticates each Pi before
# running privileged tasks against it; with this disabled, anything answering
# on 192.168.68.10/.11 would be handed sudo commands.
#
# Seed the two Pis into known_hosts once, from a trusted network position:
#
#   ssh-keyscan -H 192.168.68.10 192.168.68.11 pi0 pi1 >> ~/.ssh/known_hosts
#
# Verify the fingerprints against what each Pi reports locally:
#
#   ssh pi@192.168.68.10 'ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub'
#
# If a Pi is reimaged its host key changes and connections will fail loudly
# (which is the point). Remove the stale entry, then re-seed:
#
#   ssh-keygen -R 192.168.68.10
host_key_checking = True

# NOTE: vault_password_file is deliberately NOT set here. Setting it would
# make every playbook run fail with "vault password file not found" for
# anyone who has not created one yet, even for plays that need no secrets.
# Supply it per-invocation instead:
#
#   ansible-playbook playbooks/deploy.yaml -l pi1 --vault-password-file .vault_pass
#
# or export ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass in your shell.

[privilege_escalation]
become = true
become_method = sudo
