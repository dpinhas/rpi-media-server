---
- name: Update repos and upgrade all packages
  ansible.builtin.apt:
    upgrade: true
    update_cache: true
    force_apt_get: true
    cache_valid_time: 3600
  tags: [packages]

- name: Check if reboot is required
  ansible.builtin.command: needrestart -b
  register: reboot_required
  changed_when: false
  failed_when: false
  tags: [system]

- name: Check if running locally
  ansible.builtin.set_fact:
    is_local: "{{ ansible_connection == 'local' or inventory_hostname in ['localhost', '127.0.0.1', ansible_hostname] }}"
  tags: [system]

- name: Warn about pending reboot (local run)
  ansible.builtin.debug:
    msg: "Reboot is required but skipped — running locally. Reboot manually when ready."
  when:
    - is_local | bool
    - "'NEEDRESTART-KSTA: 2' in reboot_required.stdout or 'NEEDRESTART-KSTA: 3' in reboot_required.stdout"
  tags: [system, reboot]

- name: Reboot if required (remote run)
  ansible.builtin.reboot:
    reboot_timeout: 120
  when:
    - not is_local | bool
    - "'NEEDRESTART-KSTA: 2' in reboot_required.stdout or 'NEEDRESTART-KSTA: 3' in reboot_required.stdout"
  tags: [system, reboot]

- name: Set hostname
  ansible.builtin.shell: |
    current=$(hostname)
    if [ "$current" != "{{ inventory_hostname }}" ]; then
      raspi-config nonint do_hostname {{ inventory_hostname }}
      echo "changed"
    fi
  register: hostname_result
  changed_when: "'changed' in hostname_result.stdout"
  tags: [system]

- name: Get current locale
  ansible.builtin.command: localectl status
  register: current_locale
  changed_when: false
  tags: [system]

- name: Set locale
  ansible.builtin.shell: raspi-config nonint do_change_locale {{ pi_locale }}
  when: pi_locale not in current_locale.stdout
  tags: [system]

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  tags: [packages]

- name: Customize .bashrc
  ansible.builtin.lineinfile:
    path: "{{ pi_home }}/.bashrc"
    line: "alias ll='ls -lh --color --group-directories-first'"
    create: true
    owner: "{{ pi_user }}"
  tags: [dotfiles]

- name: Deploy .vimrc
  ansible.builtin.template:
    src: vimrc.j2
    dest: "{{ pi_home }}/.vimrc"
    owner: "{{ pi_user }}"
    mode: "0644"
  tags: [dotfiles]

- name: Deploy .gitconfig
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ pi_home }}/.gitconfig"
    owner: "{{ pi_user }}"
    mode: "0644"
  tags: [dotfiles]

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ pi_home }}/.ssh"
    state: directory
    owner: "{{ pi_user }}"
    group: "{{ pi_user }}"
    mode: "0700"
  tags: [dotfiles, ssh]

# Guard, not a deployment. The key is already present on both Pis and is
# deliberately NOT copied here - distributing a private key on every play is
# unnecessary when it exists, and this repo should never carry key material.
# What this catches is the actual failure: naming an IdentityFile that does not
# exist, which silently yields "Permission denied (publickey)" on every git
# fetch. pi0 sat unable to pull for months because of exactly that.
- name: Check the git SSH identity exists
  ansible.builtin.stat:
    path: "{{ ssh_git_identity }}"
  register: ssh_git_identity_stat
  tags: [dotfiles, ssh]

- name: Fail if the git SSH identity is missing
  ansible.builtin.fail:
    msg: >-
      {{ ssh_git_identity }} does not exist on {{ inventory_hostname }}. The
      ssh_config would pin a nonexistent key and every git-over-SSH operation
      would fail with "Permission denied (publickey)". Copy the key into place,
      or override ssh_git_identity for this host.
  when: not ssh_git_identity_stat.stat.exists
  tags: [dotfiles, ssh]

- name: Deploy SSH client config
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ pi_home }}/.ssh/config"
    owner: "{{ pi_user }}"
    mode: "0644"
  tags: [dotfiles, ssh]

# github.com is pinned rather than blindly trusted because auto_pull.sh and
# pi0's post-commit hook fetch code over SSH and then execute it. Keys are
# read from GitHub's published metadata endpoint (authenticated by TLS)
# instead of being hardcoded, since GitHub rotates them.
- name: Fetch GitHub published SSH host keys
  ansible.builtin.uri:
    url: https://api.github.com/meta
    return_content: true
  register: github_meta
  changed_when: false
  check_mode: false
  tags: [dotfiles, ssh]

- name: Pin GitHub host keys
  ansible.builtin.known_hosts:
    path: "{{ pi_home }}/.ssh/known_hosts"
    name: github.com
    key: "github.com {{ item }}"
    state: present
  loop: "{{ github_meta.json.ssh_keys }}"
  become: true
  become_user: "{{ pi_user }}"
  tags: [dotfiles, ssh]

- name: Ensure known_hosts ownership
  ansible.builtin.file:
    path: "{{ pi_home }}/.ssh/known_hosts"
    owner: "{{ pi_user }}"
    group: "{{ pi_user }}"
    mode: "0644"
  tags: [dotfiles, ssh]

- name: Create data directory
  ansible.builtin.file:
    path: "{{ data_path }}"
    state: directory
    owner: "{{ pi_user }}"
    group: "{{ pi_user }}"
  tags: [storage]

- name: Add DATA_PATH to bashrc
  ansible.builtin.lineinfile:
    path: "{{ pi_home }}/.bashrc"
    line: "export DATA_PATH='{{ data_path }}/'"
    state: present
    create: true
    insertafter: EOF
  tags: [dotfiles]

- name: Configure scheduled jobs
  ansible.builtin.include_tasks: scheduled_jobs.yaml
  tags: [cron]
