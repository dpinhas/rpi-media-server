---
groups:
  - name: system-alerts
    rules:
      # scrape_interval is 30s, so a [1m] window holds exactly 2 samples and a
      # single missed scrape leaves too few to compute a rate, blanking the
      # alert. [2m] holds 4, tolerating two missed scrapes. rate() rather than
      # irate() because irate() only ever reads the last two samples, making it
      # too spiky for a sustained-usage alert -- dips reset the `for` timer.
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance)(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
          alertname: HighCPUUsage
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 2 minutes on {{ $labels.instance }}."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 2m
        labels:
          severity: critical
          alertname: LowDiskSpace
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Less than 15% disk space remaining on root (/) of {{ $labels.instance }}."

      # /mnt/data is the ext4 SSD on the storage host and an nfs4 mount of that
      # same SSD on every NFS client, so node_exporter reports it once per host
      # and this rule would alert twice for one condition. Excluding network
      # filesystems keeps it to the host that physically owns the disk, and
      # does so without naming a host, so it survives services moving between
      # them. A broken NFS mount is a separate concern: the client's series
      # disappears rather than crossing this threshold.
      - alert: LowSSDSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/mnt/data", fstype!~"nfs.*"} / node_filesystem_size_bytes{mountpoint="/mnt/data", fstype!~"nfs.*"}) < 0.05
        for: 2m
        labels:
          severity: critical
          alertname: LowSSDSpace
        annotations:
          summary: "Low SSD space on {{ $labels.instance }}"
          description: "Less than 5% disk space remaining on /mnt/data of {{ $labels.instance }}."

      - alert: LowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.2
        for: 2m
        labels:
          severity: warning
          alertname: LowMemory
        annotations:
          summary: "Low memory on {{ $labels.instance }}"
          description: "Less than 20% memory available on {{ $labels.instance }}."

      # Both Pi models begin thermal throttling at 80C, so that is the point at
      # which performance is actually degraded. Uses node_thermal_zone_temp
      # rather than node_hwmon_temp_celsius because hwmon exposes two identical
      # series (temp0/temp1) per host, which would double-fire this alert.
      - alert: HighTemperature
        expr: node_thermal_zone_temp{type="cpu-thermal"} > 80
        for: 5m
        labels:
          severity: critical
          alertname: HighTemperature
        annotations:
          summary: "High temperature on {{ $labels.instance }}"
          description: "CPU temperature on {{ $labels.instance }} has been above 80C for more than 5 minutes and is likely being thermally throttled."

      # group_left() is required: node_load1 carries a job label that the
      # count() result does not, so default one-to-one matching returns nothing.
      - alert: HighLoad
        expr: |
          100 * (
            node_load1
            / on (instance) group_left ()
            count by (instance) (node_cpu_seconds_total{mode="idle"})
          ) > 80
        for: 5m
        labels:
          severity: critical
          alertname: HighLoad
        annotations:
          summary: "High system load on {{ $labels.instance }}"
          description: "1-minute load average on {{ $labels.instance }} has exceeded 80% of available cores for more than 5 minutes."

      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
          alertname: NodeDown
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "The node {{ $labels.instance }} has been unreachable for more than 5 minutes."

  - name: container-alerts
    rules:
      # cAdvisor stops exporting a container's series entirely once it is
      # removed, so a staleness check on container_last_seen can never fire.
      # Comparing the live container count against an hour ago is
      # self-calibrating and needs no hardcoded list of expected containers.
      # Trade-off: reports that a container vanished on a host, not which one.
      - alert: ContainerGone
        expr: |
          count by (instance) (container_last_seen{name!=""})
          < count by (instance) (container_last_seen{name!=""} offset 1h)
        for: 10m
        labels:
          severity: critical
          alertname: ContainerGone
        annotations:
          summary: "Container count dropped on {{ $labels.instance }}"
          description: "{{ $labels.instance }} is running fewer containers than it was an hour ago. Check `docker ps -a` for a container that exited or was removed."

      # restart: unless-stopped silently retries a failing container forever,
      # so a crash loop is otherwise invisible.
      - alert: ContainerRestartLoop
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 3
        for: 5m
        labels:
          severity: warning
          alertname: ContainerRestartLoop
        annotations:
          summary: "Container {{ $labels.name }} is restart looping on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} on {{ $labels.instance }} has restarted more than 3 times in 15 minutes."

      # Neither Pi has swap, so an OOM kill is the most likely way a container
      # dies. No `for:` because this is a discrete past event, not a state.
      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{name!=""}[15m]) > 0
        labels:
          severity: critical
          alertname: ContainerOOMKilled
        annotations:
          summary: "Container {{ $labels.name }} was OOM killed on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} on {{ $labels.instance }} hit an out-of-memory condition in the last 15 minutes."

      # Inert until mem_limit is set on a container: cAdvisor reports
      # container_spec_memory_limit_bytes as 0 when a container is unlimited,
      # and the `> 0` guard is what keeps that from dividing to +Inf and
      # firing for every container at once.
      - alert: ContainerMemoryNearLimit
        expr: |
          container_memory_working_set_bytes{name!=""}
          / container_spec_memory_limit_bytes{name!=""} > 0.9
          and container_spec_memory_limit_bytes{name!=""} > 0
        for: 10m
        labels:
          severity: warning
          alertname: ContainerMemoryNearLimit
        annotations:
          summary: "Container {{ $labels.name }} near its memory limit on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} on {{ $labels.instance }} has been above 90% of its configured memory limit for more than 10 minutes."

  # Monitoring self-health. Everything else in this file was inert for months
  # because rule_files pointed at a path that did not resolve, and nothing
  # reported that. These rules make the monitoring stack's own failures visible.
  #
  # Deliberately absent: a "zero rules loaded" alert. It would live in this file,
  # so a total rule-loading failure would stop it loading too - the exact bug it
  # aims to catch. That case needs an external dead-man's switch.
  - name: monitoring-self-health
    rules:
      # Catches a bad prometheus.yml after an edit. Prometheus keeps serving the
      # last good config, so without this a broken change is invisible.
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
          alertname: PrometheusConfigReloadFailed
        annotations:
          summary: "Prometheus config reload failed on {{ $labels.instance }}"
          description: "Prometheus is running on its last good config; the file on disk is rejected."

      # Alerts are firing but not reaching Telegram - e.g. a revoked bot token.
      # This is the check that would have caught the token rotation gap.
      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
          alertname: AlertmanagerNotificationsFailing
        annotations:
          summary: "Alertmanager cannot deliver notifications via {{ $labels.integration }}"
          description: "Alerts are being generated but delivery is failing. Check the bot token and network egress."

      - alert: PrometheusRuleEvaluationFailing
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          alertname: PrometheusRuleEvaluationFailing
        annotations:
          summary: "Prometheus rule evaluation failing on {{ $labels.instance }}"
          description: "One or more rules error on evaluation, so their alerts cannot fire."

  # Blackbox probes. 19 targets were being scraped every 30s with no rule
  # watching any of them: a public service could go down, or a certificate
  # lapse, and nothing would say so.
  #
  # NOTE on blast radius: the HTTPS probes resolve public DNS and traverse the
  # WAN, so a router or internet outage fails all ten at once even though the
  # services are healthy locally. Alertmanager groups them into one message;
  # read a full sweep as "connectivity", not "ten broken services".
  - name: blackbox-alerts
    rules:
      - alert: EndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 5m
        labels:
          severity: critical
          alertname: EndpointDown
        annotations:
          summary: "{{ $labels.instance }} is not responding"
          description: "The HTTPS probe for {{ $labels.instance }} has failed for more than 5 minutes. Check the container, then Traefik's routing."

      # Traefik renews Let's Encrypt certificates at 30 days remaining. Under
      # 14 means a renewal window has already been missed, which is what a bad
      # DuckDNS token looks like - the failure is otherwise silent until expiry.
      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
          alertname: CertificateExpiringSoon
        annotations:
          summary: "Certificate for {{ $labels.instance }} expires in under 14 days"
          description: "Traefik should have renewed at 30 days. Check the ACME DNS-01 challenge and that DUCKDNS_TOKEN is current."

      - alert: CertificateExpiringCritical
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) / 86400 < 3
        for: 15m
        labels:
          severity: critical
          alertname: CertificateExpiringCritical
        annotations:
          summary: "Certificate for {{ $labels.instance }} expires in under 3 days"
          description: "Browsers will start refusing this host. Renew manually if Traefik cannot."

      # Every external resolver unreachable at once means connectivity is gone,
      # not that five DNS providers failed simultaneously.
      - alert: InternetUnreachable
        expr: avg(probe_success{job="blackbox", group="external_network"}) == 0
        for: 5m
        labels:
          severity: critical
          alertname: InternetUnreachable
        annotations:
          summary: "No external host is reachable"
          description: "All external ICMP targets are failing - WAN or router outage. Expect HTTPS probe alerts alongside this."

      - alert: LanHostUnreachable
        expr: probe_success{job="blackbox", group="internal_network"} == 0
        for: 5m
        labels:
          severity: critical
          alertname: LanHostUnreachable
        annotations:
          summary: "LAN host {{ $labels.instance }} is unreachable"
          description: "ICMP to {{ $labels.instance }} is failing from the monitoring host."

      # Covers NFS (2049) and SSH (22) on the storage host. NFS failing is
      # worse than it looks: pi1 mounts /mnt/data from it.
      - alert: TcpServiceDown
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 5m
        labels:
          severity: critical
          alertname: TcpServiceDown
        annotations:
          summary: "TCP service {{ $labels.instance }} is not accepting connections"
          description: "If this is port 2049, pi1's NFS mount of /mnt/data is affected."
