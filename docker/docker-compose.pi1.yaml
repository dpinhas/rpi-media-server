---
services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG}
    user: "${PUID}:${PGID}"
    container_name: prometheus
    restart: unless-stopped
    volumes:
      # Mount the DIRECTORY, not individual files. A single-file bind mount
      # follows the original inode, and `git pull` replaces files rather than
      # editing them in place - so the container kept serving a six-month-old
      # copy of alert_rules.yml while the host file was current. Config changes
      # then require a container recreate to take effect, silently.
      - ${PWD}/../config/prometheus:/etc/prometheus:ro
      - ${DATA_PATH}/config/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}'
      # Allows `curl -X POST /-/reload` instead of `docker kill -s HUP`.
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT}:9090"

  grafana:
    image: grafana/grafana:${GRAFANA_TAG}
    user: "${PUID}:${PGID}"
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ${DATA_PATH}/config/grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_TAG}
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ${PWD}/../config/alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"

  blackbox:
    image: prom/blackbox-exporter:${BLACKBOX_TAG}
    container_name: blackbox
    ports:
      - "${BLACKBOX_PORT}:9115"
    restart: always
    volumes:
      # Directory, not a single file: git pull replaces files with new inodes,
      # which a single-file bind mount does not follow, so the container would
      # keep serving the pre-pull copy indefinitely.
      - ${PWD}/../config/blackbox:/config:ro
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    command:
      - '--config.file=/config/blackbox.yml'

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_TAG}
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /mnt/data:/mnt/data:ro
      - ${PWD}/../config/custom_metrics/:/custom_metrics
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.textfile.directory=/custom_metrics/'
      - '--collector.tcpstat'

  cadvisor:
    image: zcube/cadvisor:${CADVISOR_TAG}
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT}:8080"
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
      - "--disable_metrics=accelerator,cpu_topology,disk,memory_numa,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,resctrl,cpuset,advtcp,memory_numa"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  ping-exporter:
    image: czerwonk/ping_exporter:${PING_EXPORTER_TAG}
    container_name: ping-exporter
    restart: unless-stopped
    ports:
      - "${PING_EXPORTER_PORT}:9427"
    volumes:
      # Directory mount for the same inode reason as blackbox above.
      - ${PWD}/../config/ping_exporter:/config:ro
