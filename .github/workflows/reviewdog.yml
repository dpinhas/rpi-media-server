name: reviewdog
on: [pull_request]

# reviewdog's github-pr-check reporter posts a Check Run, which needs
# checks: write. Without a permissions block the workflow inherits the repo
# default; if that is read-only every reviewdog job fails while plain `run:`
# jobs pass - exactly the split seen on PR #57.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  yamllint:
    name: runner / yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        uses: reviewdog/action-yamllint@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          fail_level: warning

  shellcheck:
    name: runner / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          fail_level: warning

  ansible-lint:
    name: runner / ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ansible-lint
        uses: reviewdog/action-ansiblelint@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          fail_level: warning

  gitleaks:
    name: runner / gitleaks
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required — the scan covers full history, not just
      # the PR diff, because a secret is exposed from the moment it is
      # pushed regardless of which commit introduced it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Known historical leaks are suppressed by fingerprint via
      # .gitleaksignore. That file is pinned to specific commits, so the same
      # credential reintroduced in a new commit still fails here.
      - name: Scan git history for secrets
        run: gitleaks git --no-banner --redact -c .gitleaks.toml --verbose .

  vault-encrypted:
    name: runner / vault-encrypted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # vault.yaml is meant to be committed, but only encrypted. An
      # ansible-vault file always begins with the literal $ANSIBLE_VAULT
      # header; anything else means plaintext secrets are about to land
      # in git history. *.example files are templates and are skipped.
      - name: Fail if any vault file is not ansible-vault encrypted
        run: |
          set -euo pipefail
          status=0
          found=0
          while IFS= read -r -d '' f; do
            found=1
            if head -c 14 "$f" | grep -q '\$ANSIBLE_VAULT'; then
              echo "ok        $f"
            else
              echo "PLAINTEXT $f"
              status=1
            fi
          done < <(find . -path ./.git -prune -o \
                        \( -name 'vault.yml' -o -name 'vault.yaml' \) \
                        -type f -print0)
          if [ "$found" -eq 0 ]; then
            echo "no vault file committed yet - nothing to check"
          fi
          if [ "$status" -ne 0 ]; then
            echo
            echo "ERROR: unencrypted vault file(s) found."
            echo "Run: ansible-vault encrypt <path>"
          fi
          exit "$status"
